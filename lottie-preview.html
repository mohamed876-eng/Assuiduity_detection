<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101014; }
      #stage { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import lottie from 'lottie-web'
      import data from '/src/assets/animations/Website-landing-page-with-blocs_cleaned.json'

      const frame = Number(new URLSearchParams(location.search).get('frame') || 240)
      const anim = lottie.loadAnimation({
        container: document.getElementById('stage'),
        renderer: 'svg',
        loop: false,
        autoplay: false,
        animationData: data,
        rendererSettings: { preserveAspectRatio: 'xMidYMid slice' },
      })
      anim.addEventListener('DOMLoaded', () => {
        anim.goToAndStop(frame, true)
        document.title = `frame-${frame}`
      })
    </script>
  </body>
</html>
